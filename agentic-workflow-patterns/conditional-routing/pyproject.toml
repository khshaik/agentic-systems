[project]
name = "conditional-routing"
version = "0.1.0"
description = "A provider-configurable LangGraph conditional-routing example"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-google-genai>=2.0.10",
    "langgraph>=0.2.74",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
nvidia = [
    "langchain-nvidia-ai-endpoints>=0.3.0",
]
